name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: version
        id: version
        run: |
          read -r version code < <(node scripts/version.ts)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "versionCode=$code" >>"$GITHUB_OUTPUT"
          echo "tag=v${version}-${code}" >>"$GITHUB_OUTPUT"

      - name: build
        run: pnpm build

      - name: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.zip

      - name: make update files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          OUT_DIR: update-out
        run: node scripts/make-update.ts

      - name: publish update branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: update
          build_dir: update-out
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
