<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUSFS LKM</title>
</head>
<body>
    <header class="page-head">
        <h1>SUSFS LKM</h1>
        <div class="page-meta">
            <span class="version" id="module-version"></span>
            <button id="theme-btn" class="theme-btn" type="button" title="切换主题">🌙</button>
        </div>
    </header>

    <section class="card">
        <div class="card-head">
            <h2>状态</h2>
            <button id="refresh-btn" class="btn ghost small">刷新</button>
        </div>
        <div class="status-head">
            <span id="status-badge" class="badge">读取中…</span>
        </div>
        <div class="row">
            <span class="row-k">内核版本</span>
            <span class="row-v" id="status-kernel">-</span>
        </div>
        <div class="row">
            <span class="row-k">GKI 变体</span>
            <span class="row-v" id="status-variant">-</span>
        </div>
        <div class="row">
            <span class="row-k">SuSFS 版本</span>
            <span class="row-v" id="status-susfs">-</span>
        </div>
        <div class="row">
            <span class="row-k">驱动大小</span>
            <span class="row-v" id="status-size">-</span>
        </div>
    </section>

    <section class="card">
        <div class="card-head">
            <h2>检测更新</h2>
        </div>

        <div id="view-idle">
            <div class="update-actions">
                <button id="check-btn" class="btn">检测更新</button>
            </div>
        </div>

        <div id="view-busy" hidden>
            <div class="update-actions">
                <button class="btn" disabled><span class="spinner"></span><span id="busy-text"></span></button>
            </div>
        </div>

        <div id="view-available" hidden>
            <div class="update-head">
                <span class="badge new">发现新版本</span>
                <span class="tag" id="available-tag"></span>
            </div>
            <div class="update-actions">
                <button id="do-update-btn" class="btn primary">更新</button>
            </div>
        </div>

        <div id="view-uptodate" hidden>
            <div class="update-head">
                <span class="badge ok">已是最新版本</span>
                <span class="tag" id="uptodate-tag"></span>
            </div>
            <div class="update-actions">
                <button id="recheck-btn" class="btn ghost">再查一次</button>
            </div>
        </div>

        <div id="view-failed" hidden>
            <div class="update-head">
                <span class="badge fail">更新失败</span>
            </div>
            <div class="empty" id="failed-reason"></div>
            <div class="update-actions">
                <button id="retry-btn" class="btn primary">重试</button>
            </div>
            <pre class="log" id="failed-log"></pre>
        </div>

        <div id="view-note" hidden>
            <div class="empty" id="note-text"></div>
        </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
